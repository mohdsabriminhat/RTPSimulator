<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <style>
        body {
            margin: 0;
            background-color: #002147 ;
            font-family: Arial, sans-serif;
            color:#002147  ;
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px; 
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: white ;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            width: 100%;
            background-color: #f5f5f5; 
            gap: 50px;
            padding: 40px; 
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgb(0, 174, 255); 
        }

        form label {
            display: block;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            border: 1px solid #002147;
            background-color: white;
            color: #002147;
        }

        input::placeholder {
            color: #999;
        }

        .full-width {
            grid-column: span 2;
        }

        button {
            width: 1150px;
            padding: 10px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 auto;
            display: block;
            border: 1px solid white;
            background-color: #002147;
            color: white;
        }

        ul {
            color: red;
            text-align: center;
            list-style: none;
            padding: 0;
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .radio-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; 
        }

        .radio-group label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .radio-group input {
            margin: 0 10px; 
        }

        
        .login-link {
            text-align: center;
            font-size: 16px;
            grid-column: span 2; 
            margin-bottom: 1px;
        }

        .login-link a {
            color: #333; 
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sign Up RTP Simulator</h2>

        {% if messages %}
        <ul>
            {% for message in messages %}
            <li>{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" placeholder="Insert your name" required>
            </div>

            <div class="form-group">
                <label>Contact</label>
                <input type="text" name="contact" placeholder="Insert your contact" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Insert your email" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Insert your username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Insert your password" required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="role" value="instructor" required> Instructor
                    </label>
                    <label>
                        <input type="radio" name="role" value="visitor" required> Visitor
                    </label>
                </div>
            </div>

            <div class="full-width">
                <button type="submit">Sign Up</button>
            </div>

            <div class="login-link">
                <p>Have an account? <a href="{% url 'login' %}">Login here</a></p>
            </div>
        </form>
    </div>
</body>
</html>
