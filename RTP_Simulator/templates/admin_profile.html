<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            background-color: #002147;
            font-family: Arial, sans-serif;
            color: #002147;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            background-color: #002147;
            padding: 14px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        main {
            padding: 20px;
            margin-right: 250px;
        }


        #timeDisplay {
            font-size: 24px;
            color: #fff;
            padding: 10px;
        }

        .sidebar {
            height: 100%;
            width: 250px;
            position: fixed;
            top: 0;
            right: 0;
            background-color: white;
            color: #002147;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            color: #002147;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #0056a6;
            color: white;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 24px;
            cursor: pointer;
        }

        #openSidebarBtn {
            position: fixed;
            top: 8px;
            left: 48%;
            background-color: #002147;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 1001;
        }

        #openSidebarBtn.hide {
            display: none;
        }

        .center-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-wrapper {
            display: flex;
            margin-right: 400px;
            margin-bottom: 150px;
            width: 100%;
            max-width: 700px;
        }

        form {
            display: grid;
            width: 150%;
            max-width: 1500px;
            background-color: #f5f5f5;
            gap: 25px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgb(0, 174, 255);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            color: #002147;
            font-weight: bold;
        }

        input {
            padding: 10px;
            border: 1px solid #002147;
            border-radius: 5px;
            background-color: white;
            color: #002147;
        }

        button {
            padding: 10px;
            background-color: #002147;
            color: white;
            font-weight: bold;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background-color: #0056a6;
        }

        h2 {
            text-align: left;
            color: white;
            margin-bottom: 30px;
            padding-left: 10px;
        }
    </style>
</head>
<body>

    <button id="openSidebarBtn" onclick="openSidebar()">☰</button>

    <div id="sidebar" class="sidebar" style="display: none;">
        <span class="closebtn" onclick="closeSidebar()">&times;</span>
        <a href="{% url 'admin_homepage' %}">Homepage</a>
        <a href="{% url 'visitor_management' %}">Manage Visitors</a>
        <a href="{% url 'instructor_management' %}">Manage Instructors</a>
        <a href="{% url 'certificate_request_list' %}">Manage Certificate</a>
        <a href="{% url 'admin_logout' %}">Logout</a>
    </div>

<div class="center-container">
    <div class="form-wrapper">
        <div style="width: 100%;">
            <h2>Your Profile</h2>

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" name="name" value="{{ admin.name }}" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ admin.email }}" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" value="{{ admin.password }}" required>
                </div>

                <button type="submit">Save Update Profile</button>
            </form>
        </div>
    </div>
</div>
<script>
    function openSidebar() {
        document.getElementById("sidebar").style.display = "block";
        document.getElementById("openSidebarBtn").classList.add("hide");
    }

    function closeSidebar() {
        document.getElementById("sidebar").style.display = "none";
        document.getElementById("openSidebarBtn").classList.remove("hide");
    }

</script>
</body>
</html>
