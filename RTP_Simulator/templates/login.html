<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
            margin: 0;
            background-color: #002147;
            font-family: Arial, sans-serif;
            color: #002147;
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            width: 100%;
            background-color: #f5f5f5;
            gap: 50px;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgb(0, 174, 255);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            color: #002147;
        }

        input {
            padding: 10px;
            border: 1px solid #002147;
            border-radius: 5px;
            background-color: white;
            color: #002147;
        }

        input::placeholder {
            color: #999;
        }

        button {
            padding: 10px;
            background-color: #002147;
            color: white;
            font-weight: bold;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .login-link {
            text-align: center;
            font-size: 16px;
            margin-bottom: 1px;
        }

        .login-link a {
            color: #333;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Style for displaying messages */
        .message {
            color: red;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Login RTP Simulator</h2>

        <!-- Display error messages if there are any -->
        {% if messages %}
            <div class="message">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit">Login</button>

            <!-- Have an account message inside the form container -->
            <div class="login-link">
                <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
            </div>
        </form>
    </div>
</body>
</html>
