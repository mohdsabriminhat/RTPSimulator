<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body {
            margin: 0;
            background-color: #002147;
            font-family: Arial, sans-serif;
            color: #002147;
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            width: 100%;
            background-color: #f5f5f5; 
            gap: 50px;
            padding: 40px; 
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgb(0, 174, 255); 
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 5px;
            color: #002147;
        }

        input {
            padding: 10px;
            border: 1px solid #002147;
            border-radius: 5px;
            background-color: white;
            color: #002147;
        }

        button {
            padding: 10px;
            background-color: #002147;
            color: white;
            font-weight: bold;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        .warning {
            color: red;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Login</h2>

        {% if warning_message %}
        <div class="warning">{{ warning_message }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
