{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <style>
        body {
            background-color: #002147;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        header {
            background-color: #002147;
            color: white;
            text-align: left;
            text-align: center;
            padding-top: 5px;
        }

        main {
            padding: 20px;
            margin-left: 250px; 
        }

        #openSidebarBtn {
            position: fixed;
            top: 8px;
            left: 10px;
            background-color: #002147;
            color: white;
            border: none;
            padding: 15px 20px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 4px;
            z-index: 1001;
        }

        #openSidebarBtn.hide {
            display: none;
        }

        .sidebar {
            height: 100%;
            width: 250px;
            position: fixed;
            top: 0;
            left: 10; 
            background-color: white;
            color: #002147;
            overflow-x: hidden;
            transition: 0.3s;
            padding-top: 60px;
            z-index: 10000;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
        }

        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            color: #002147;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #0056a6;
            color: white;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 15px;
            right: 15px; 
            font-size: 24px;
            cursor: pointer;
        }

        .iframe-container {
            position: relative;
            z-index: 1;
        }

        iframe {
            width: 97%;
            height: 1000px;
            border: none;
            display: block;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

<button id="openSidebarBtn" onclick="openSidebar()">☰</button>

<!-- Sidebar -->
<div id="sidebar" class="sidebar" style="display: none;">
    <span class="closebtn" onclick="closeSidebar()">&times;</span>
    <a href="#">Profile</a>
    <a href="#">Settings</a>
    <a href="{% url 'login' %}">Logout</a>
</div>

<main>
    <div class="iframe-container">
        <iframe src="http://10.10.4.65:8000/visitor1.html"></iframe>
    </div>
</main>

<script>
    function openSidebar() {
        document.getElementById("sidebar").style.display = "block";
        document.getElementById("openSidebarBtn").classList.add("hide");
    }

    function closeSidebar() {
        document.getElementById("sidebar").style.display = "none";
        document.getElementById("openSidebarBtn").classList.remove("hide");
    }
</script>

</body>
</html>
{% endblock %}
